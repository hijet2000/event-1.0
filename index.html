    <style>
      :root {
        --color-primary: #4f46e5;
        --color-secondary: #ec4899;
        --color-background-color: #f9fafb;
        --font-family: 'Inter', sans-serif;
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }
      html.dark { --color-background-color: #111827; }
      body {
        font-family: var(--font-family);
        background-color: var(--color-background-color);
        padding: var(--sat) var(--sar) var(--sab) var(--sal);
        overscroll-behavior-y: none;
      }
      @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-down { animation: fadeInDown 0.3s ease-out; }
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #000;
        color: white;
        padding: 8px;
        z-index: 100;
        transition: top 0.3s;
      }
      .skip-link:focus { top: 0; }
    </style>
</head>
<body class="antialiased">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if (localStorage.getItem('adminDarkMode') === 'true' || (!('adminDarkMode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: 'var(--color-primary)',
              secondary: 'var(--color-secondary)',
              'background-color': 'var(--color-background-color)'
            },
            fontFamily: { sans: ['var(--font-family)', 'sans-serif'] }
          }
        }
      }
    </script>
